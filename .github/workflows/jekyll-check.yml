name: Validate Jekyll site

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Build GitHub Pages site
        run: bundle exec jekyll build --trace
        env:
          JEKYLL_ENV: production
